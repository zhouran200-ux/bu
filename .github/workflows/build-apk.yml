name: Build APK only

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name, e.g. 2.9.0. Leave blank to use MARKETING_VERSION.'
        required: false
        default: ''
  workflow_call:
    inputs:
      version_name:
        description: 'Version name baked into the APK. Blank uses MARKETING_VERSION.'
        required: false
        type: string
        default: ''
    outputs:
      version:
        description: 'The version name baked into the APK'
        value: ${{ jobs.build-apk.outputs.version }}

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve-version.outputs.version }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Resolve version
        id: resolve-version
        env:
          VER_INPUT: ${{ inputs.version_name }}
        run: |
          set -eu
          VER="${VER_INPUT}"
          if [ -z "$VER" ]; then
            VER=$(sed -n 's/^val MARKETING_VERSION = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -n 1)
          fi
          if [ -z "$VER" ]; then echo "::error::Could not determine the version."; exit 1; fi
          DIGITS=$(printf '%s' "$VER" | tr -cd '0-9')
          if [ -z "$DIGITS" ]; then echo "::error::Version '$VER' has no digits to build a version code from."; exit 1; fi
          CODE=$(( DIGITS * 10000 + GITHUB_RUN_NUMBER ))
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building APK for version $VER (versionCode $CODE)"

      - name: Check signing secrets
        env:
          LUCENT_KEYSTORE_BASE64: ${{ secrets.LUCENT_KEYSTORE_BASE64 }}
          LUCENT_KEYSTORE_PASSWORD: ${{ secrets.LUCENT_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$LUCENT_KEYSTORE_BASE64" ] || [ -z "$LUCENT_KEYSTORE_PASSWORD" ]; then
            echo "::error::Missing signing secrets."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Install Android SDK
        run: |
          set -eu
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Decode keystore
        env:
          LUCENT_KEYSTORE_BASE64: ${{ secrets.LUCENT_KEYSTORE_BASE64 }}
        run: printf '%s' "$LUCENT_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lucent-release.keystore"

      - name: Assemble signed APK
        env:
          LUCENT_KEYSTORE_FILE: ${{ runner.temp }}/lucent-release.keystore
          LUCENT_KEYSTORE_PASSWORD: ${{ secrets.LUCENT_KEYSTORE_PASSWORD }}
          LUCENT_KEY_ALIAS: lucent
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PversionCode=${{ steps.resolve-version.outputs.version_code }} \
            -PversionName='${{ steps.resolve-version.outputs.version }}'

      - name: Verify APK
        run: |
          APK="$(find app/build/outputs/apk/release -name '*.apk' ! -name '*unsigned*' | head -n 1)"
          [ -n "$APK" ] || { echo "::error::No signed APK found."; exit 1; }
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort | tail -n 1)"
          "$APKSIGNER" verify --print-certs "$APK"
          echo "APK verified: $APK ($(stat -c%s "$APK") bytes)"

      - name: Rename APK
        run: |
          VER="${{ steps.resolve-version.outputs.version }}"
          APK=$(find app/build/outputs/apk/release -name '*.apk' ! -name '*unsigned*' | head -n 1)
          mv "$APK" "app/build/outputs/apk/release/Lucent.for.Android-$VER.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: lucent-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload R8 mapping
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: r8-mapping-release
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
  publish-preview:
    needs: build-apk
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: lucent-release-apk
          path: apk
      - name: Publish preview release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          APK=$(find apk -name '*.apk' | head -n 1)
          [ -n "$APK" ] || { echo "::error::No APK found."; exit 1; }
          if ! gh release view preview --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create preview --prerelease --title "Preview Build" --notes "Initial preview" --repo "${{ github.repository }}"
          fi
          EXISTING=$(gh release view preview --repo "${{ github.repository }}" --json body -q .body 2>/dev/null || true)
          KEPT=$(printf '%s\n' "$EXISTING" | grep -v -e '^APK-' -e '^Commit:' -e '^Version:' -e '^Run:' || true)
          NOTES="$KEPT
          APK-Commit: ${{ github.sha }}
          APK-Version: ${{ needs.build-apk.outputs.version }}
          APK-Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh release upload preview "$APK" --clobber --repo "${{ github.repository }}"
          gh release edit preview --notes "$NOTES" --repo "${{ github.repository }}"

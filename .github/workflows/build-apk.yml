name: Build APK only

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name, e.g. 2.9.0. Leave blank to use MARKETING_VERSION.'
        required: false
        default: ''
  workflow_call:
    inputs:
      version_name:
        description: 'Version name baked into the APK. Blank uses MARKETING_VERSION.'
        required: false
        type: string
        default: ''
      require_release_signing:
        description: 'Reject debug signing for a formal release.'
        required: false
        type: boolean
        default: false
    outputs:
      version:
        description: 'The version name baked into the APK'
        value: ${{ jobs.build-apk.outputs.version }}

# One live build per branch: a newer push replaces the in-flight run instead of
# queueing a second full Gradle build.
concurrency:
  group: apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve-version.outputs.version }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Resolve version
        id: resolve-version
        env:
          VER_INPUT: ${{ inputs.version_name }}
        run: |
          set -eu
          VER="${VER_INPUT}"
          if [ -z "$VER" ]; then
            VER=$(sed -n 's/^val MARKETING_VERSION = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -n 1)
          fi
          if [ -z "$VER" ]; then echo "::error::Could not determine the version."; exit 1; fi
          DIGITS=$(printf '%s' "$VER" | tr -cd '0-9')
          if [ -z "$DIGITS" ]; then echo "::error::Version '$VER' has no digits to build a version code from."; exit 1; fi
          CODE=$(( DIGITS * 10000 + GITHUB_RUN_NUMBER ))
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building APK for version $VER (versionCode $CODE)"

      - name: Resolve signing key
        id: resolve-key
        env:
          KEYSTORE_B64: ${{ secrets.LUCENT_KEYSTORE_BASE64 }}
          KEYSTORE_PW: ${{ secrets.LUCENT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LUCENT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LUCENT_KEY_PASSWORD }}
          REQUIRE_RELEASE_SIGNING: ${{ inputs.require_release_signing || false }}
        run: |
          set -eu
          if { [ -n "$KEYSTORE_B64" ] && [ -z "$KEYSTORE_PW" ]; } || { [ -z "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PW" ]; }; then
            echo "::error::正式签名配置不完整，必须同时配置 LUCENT_KEYSTORE_BASE64 和 LUCENT_KEYSTORE_PASSWORD。"
            exit 1
          fi
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PW" ]; then
            STORE="$RUNNER_TEMP/lucent-release.keystore"
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$STORE"
            echo "LUCENT_KEYSTORE_PASSWORD=$KEYSTORE_PW" >> "$GITHUB_ENV"
            echo "LUCENT_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PW}" >> "$GITHUB_ENV"
            echo "alias=${KEY_ALIAS:-lucent}" >> "$GITHUB_OUTPUT"
            echo "mode=release" >> "$GITHUB_OUTPUT"
          else
            if [ "$REQUIRE_RELEASE_SIGNING" = "true" ]; then
              echo "::error::正式发布必须配置专用签名密钥，不能使用预览调试签名。"
              exit 1
            fi
            echo "::warning::未配置 LUCENT_KEYSTORE_BASE64 / LUCENT_KEYSTORE_PASSWORD，本次改用仓库内的 debug.keystore 签名。APK 可以正常安装使用，但它不是可分发的正式发布签名。"
            STORE="$GITHUB_WORKSPACE/debug.keystore"
            echo "LUCENT_KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "alias=androiddebugkey" >> "$GITHUB_OUTPUT"
            echo "mode=debug-signed" >> "$GITHUB_OUTPUT"
          fi
          if [ ! -s "$STORE" ]; then echo "::error::签名文件不存在或为空：$STORE"; exit 1; fi
          echo "store=$STORE" >> "$GITHUB_OUTPUT"
          echo "Signing mode resolved from the keystore at $STORE"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Install Android SDK
        run: |
          set -eu
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Assemble signed APK
        env:
          LUCENT_KEYSTORE_FILE: ${{ steps.resolve-key.outputs.store }}
          LUCENT_KEY_ALIAS: ${{ steps.resolve-key.outputs.alias }}
        run: |
          set +e
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PversionCode=${{ steps.resolve-version.outputs.version_code }} \
            -PversionName='${{ steps.resolve-version.outputs.version }}' 2>&1 | tee "$RUNNER_TEMP/gradle-release.log"
          status=${PIPESTATUS[0]}
          if [ "$status" != "0" ]; then
            WHY=$(awk '/\* What went wrong/{f=1} f{print} /^\* Try/{exit}' "$RUNNER_TEMP/gradle-release.log" | head -n 30)
            NET=$(grep -E "Could not (GET|resolve|download)|status code|Connection (refused|reset)|Read timed out|UnknownHost|SSL|Certificate" "$RUNNER_TEMP/gradle-release.log" | head -n 12)
            if [ -n "$NET" ]; then
              WHY="$WHY [repo/network] $NET"
            fi
            if [ -z "$WHY" ]; then
              WHY=$(grep -E "^e: |error:|FAILED" "$RUNNER_TEMP/gradle-release.log" | head -n 30)
            fi
            if [ -z "$WHY" ]; then
              WHY=$(tail -n 40 "$RUNNER_TEMP/gradle-release.log")
            fi
            ONE=$(printf '%s' "$WHY" | sed 's/::/--/g' | tr -d '\r' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::assembleRelease 失败（退出码 $status）：%0A$ONE"
            exit "$status"
          fi

      - name: Verify APK
        run: |
          APK="$(find app/build/outputs/apk/release -name '*.apk' ! -name '*unsigned*' | head -n 1)"
          [ -n "$APK" ] || { echo "::error::No signed APK found."; exit 1; }
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort | tail -n 1)"
          "$APKSIGNER" verify --print-certs "$APK"
          echo "APK verified: $APK ($(stat -c%s "$APK") bytes)"

      - name: Rename APK
        run: |
          VER="${{ steps.resolve-version.outputs.version }}"
          SUFFIX=""
          if [ "${{ steps.resolve-key.outputs.mode }}" = "debug-signed" ]; then
            SUFFIX="-debugsigned"
          fi
          APK=$(find app/build/outputs/apk/release -name '*.apk' ! -name '*unsigned*' | head -n 1)
          mv "$APK" "app/build/outputs/apk/release/Lucent.for.Android-$VER$SUFFIX.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: lucent-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload R8 mapping
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: r8-mapping-release
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
  publish-preview:
    timeout-minutes: 50
    needs: build-apk
    if: ${{ !inputs.require_release_signing }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Require a green check workflow before publishing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          API="https://api.github.com/repos/${{ github.repository }}/actions/workflows/check.yml/runs?head_sha=$SHA&per_page=1"
          for attempt in $(seq 1 120); do
            BODY=$(curl --fail --connect-timeout 10 --max-time 30 -sS -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "$API")
            STATUS=$(printf '%s' "$BODY" | python3 -c 'import json,sys; r=json.load(sys.stdin).get("workflow_runs", []); print(r[0]["status"] if r else "missing")')
            CONCLUSION=$(printf '%s' "$BODY" | python3 -c 'import json,sys; r=json.load(sys.stdin).get("workflow_runs", []); print((r[0].get("conclusion") or "") if r else "")')
            echo "check status=$STATUS conclusion=$CONCLUSION (attempt $attempt)"
            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" = "success" ]; then exit 0; fi
              echo "::error::check workflow finished with $CONCLUSION; refusing to publish a preview."
              exit 1
            fi
            sleep 20
          done
          echo "::error::check workflow did not finish in time; refusing to publish a preview."
          exit 1
      - name: Download APK
        uses: actions/download-artifact@v8.0.2
        with:
          name: lucent-release-apk
          path: apk
      - name: Publish preview release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          APK=$(find apk -name '*.apk' | head -n 1)
          [ -n "$APK" ] || { echo "::error::No APK found."; exit 1; }
          if ! gh release view preview --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create preview --prerelease --title "Preview Build" --notes "Initial preview" --repo "${{ github.repository }}"
          fi
          EXISTING=$(gh release view preview --repo "${{ github.repository }}" --json body -q .body 2>/dev/null || true)
          KEPT=$(printf '%s\n' "$EXISTING" | grep -v -e '^APK-' -e '^Commit:' -e '^Version:' -e '^Run:' || true)
          NOTES="$KEPT
          APK-Commit: ${{ github.sha }}
          APK-Version: ${{ needs.build-apk.outputs.version }}
          APK-Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh release upload preview "$APK" --clobber --repo "${{ github.repository }}"
          gh release edit preview --notes "$NOTES" --repo "${{ github.repository }}"

name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Run Python tool tests
        run: |
          set -o pipefail
          mkdir -p ci-reports
          python3 -m unittest discover -s tools/tests -v 2>&1 | tee ci-reports/tool-tests.log
      - name: Run lightweight validation
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          mkdir -p ci-reports
          python3 tools/verify.py quick 2>&1 | tee ci-reports/source-checks.log
      - name: Check i18n generation is up-to-date
        if: ${{ !cancelled() }}
        run: |
          python3 tools/i18n/gen_i18n.py
          git diff --exit-code -- app/src/main/java/com/lucent/app/i18n/I18n.kt
      - name: Upload source validation logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: source-validation
          path: ci-reports/
          if-no-files-found: warn

  android-jvm-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Install Android SDK components
        run: |
          set -eu
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Compile both variants and run all JVM tests, lint and schema generation
        run: |
          set -o pipefail
          mkdir -p ci-reports
          ./gradlew :app:compileDebugKotlin :app:compileReleaseKotlin :app:testDebugUnitTest :app:testReleaseUnitTest :app:lintDebug :app:lintRelease :app:compileDebugAndroidTestKotlin :baselineprofile:compileDebugKotlin :app:kspDebugKotlin --continue --no-daemon --console=plain 2>&1 | tee ci-reports/gradle-check.log
      - name: Verify actual test execution
        if: ${{ !cancelled() }}
        run: |
          python3 tools/test_inventory.py app/build/test-results/testDebugUnitTest app/build/test-results/testReleaseUnitTest
      - name: Summarise JVM results
        if: always()
        run: |
          python3 tools/test_report_summary.py app/build/test-results/testDebugUnitTest "Debug JVM"
          python3 tools/test_report_summary.py app/build/test-results/testReleaseUnitTest "Release JVM"
      - name: Upload complete validation reports even after failure
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-validation-reports
          path: |
            ci-reports/
            app/build/reports/
            app/build/test-results/
            app/schemas/
            app/lint-baseline.xml
          if-no-files-found: warn

  android-device-check:
    name: Android device API ${{ matrix.api-level }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api-level: [33, 35]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install build SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Record application and test serialization dependencies
        # dependencyInsight takes --configuration/--dependency per task, so the three
        # reports cannot share one invocation. Reuse the Gradle daemon instead of
        # paying a cold configuration three times (--no-daemon forced three cold starts).
        run: |
          set -o pipefail
          mkdir -p ci-reports
          ./gradlew :app:dependencyInsight --configuration debugRuntimeClasspath --dependency kotlinx-serialization --console=plain 2>&1 | tee ci-reports/app-serialization.log
          ./gradlew :app:dependencyInsight --configuration debugAndroidTestRuntimeClasspath --dependency kotlinx-serialization --console=plain 2>&1 | tee ci-reports/test-serialization.log
          ./gradlew :app:dependencyInsight --configuration debugAndroidTestRuntimeClasspath --dependency room-migration --console=plain 2>&1 | tee ci-reports/room-migration.log
      - name: Run Android instrumentation tests on cloud emulator
        if: ${{ !cancelled() }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon --console=plain
      - name: Verify instrumentation tests actually ran
        if: ${{ !cancelled() }}
        run: python3 tools/test_inventory.py app/build/outputs/androidTest-results/connected
      - name: Summarise instrumentation results
        if: always()
        run: python3 tools/test_report_summary.py app/build/outputs/androidTest-results/connected "Android device API ${{ matrix.api-level }}"
      - name: Upload instrumentation reports even after failure
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-device-reports-api-${{ matrix.api-level }}
          path: |
            ci-reports/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/logs/
          if-no-files-found: warn

  check:
    name: check
    if: always()
    needs: [source-hygiene, android-jvm-check, android-device-check]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every validation job and device API
        env:
          SOURCE_RESULT: ${{ needs.source-hygiene.result }}
          JVM_RESULT: ${{ needs.android-jvm-check.result }}
          DEVICE_RESULT: ${{ needs.android-device-check.result }}
        run: |
          test "$SOURCE_RESULT" = success
          test "$JVM_RESULT" = success
          test "$DEVICE_RESULT" = success

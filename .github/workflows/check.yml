name: check

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - name: No comments, balanced brackets, no oversized files
        run: python3 tools/code_hygiene_check.py

      - name: Check i18n generation is up-to-date
        run: |
          python3 tools/i18n/gen_i18n.py
          git diff --exit-code -- app/src/main/java/com/lucent/app/i18n/I18n.kt

      - name: Check the three version numbers agree
        run: python3 tools/version_check.py

      - name: Check every cached setting is written back on change
        run: python3 tools/settings_cache_check.py

      - name: Check no scrolling container is nested inside another
        run: |
          python3 tools/compose_scroll_check.py --self-test
          python3 tools/compose_scroll_check.py

      - name: Design conformance score (non-blocking)
        run: python3 tools/design_audit.py

  android-jvm-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Install Android SDK components
        run: |
          set -eu
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Run Android JVM unit tests (shared and Android logic)
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain

      - name: Count the tests that actually ran
        if: always()
        run: python3 tools/test_inventory.py

      - name: Compile the release Kotlin sources
        run: ./gradlew :app:compileReleaseKotlin --no-daemon --console=plain

      - name: Run Android lint
        run: ./gradlew :app:lintRelease --no-daemon --console=plain

      - name: Generate Room exported schemas
        run: ./gradlew :app:kspDebugKotlin --no-daemon --console=plain

      - name: Summarise test results
        if: always()
        run: python3 tools/test_report_summary.py app/build/test-results/testDebugUnitTest "Android"

      - name: Upload lint baseline
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lint-baseline
          path: app/lint-baseline.xml
          if-no-files-found: ignore

      - name: Upload Room schema JSON
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: room-schemas
          path: app/schemas
          if-no-files-found: ignore

      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-test-results
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
